# Multi-backend gRPC reporter e2e:
# two healthy mock collectors → identify active via unique probe → kill it →
# assert standby POST:/info + toolkit log count growth.

setup:
  env: compose
  file: docker-compose.yml
  timeout: 1200
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH

trigger:
  action: http
  interval: 3s
  times: 5
  url: http://${consumer_host}:${consumer_8080}/info
  method: POST

verify:
  retry:
    # Bound total wall time under the 90m GHA e2e job timeout. Each attempt
    # already waits for transport recovery and standby traffic growth.
    count: 12
    interval: 5s
  cases:
    - name: fail over to standby after active collector stops
      query: bash test/e2e/case/grpc-multi-backend/verify-failover.sh
      expected: expected/failover-ok.yml
